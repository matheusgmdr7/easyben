[build]
  # Limpa cache webpack após restore do plugin Next.js (evita WasmHash / reading 'length' em CI).
  command = "npm ci --legacy-peer-deps && rm -rf .next/cache node_modules/.cache && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "9"
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_OPTIONS = "--max-old-space-size=4096"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
