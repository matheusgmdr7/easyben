# Deploy dos workers WhatsApp (BullMQ) no Railway — NÃO usar no Netlify
#
# Railway → New Service → GitHub → repo easyben
# Settings → Build:
#   Builder: Dockerfile
#   Dockerfile path: Dockerfile.workers
#
# Ou: variável RAILWAY_DOCKERFILE_PATH=Dockerfile.workers
#
# Start command (já no Dockerfile): npm run workers:whatsapp:prod
#
# Variables (Production):
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_WHATSAPP_NUMBER
#   TWILIO_WEBHOOK_BASE_URL=https://easyben.com.br
#   UPSTASH_REDIS_URL=rediss://...
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.workers"

[deploy]
startCommand = "npm run workers:whatsapp:prod"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[build.environment]
PUPPETEER_SKIP_DOWNLOAD = "true"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
